spring.application.name=backend

# ─── PostgreSQL Configuration ────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/ecotrack_db
spring.datasource.username=postgres
spring.datasource.password=Arpita@1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate Configuration ──────────────────────────────────────────
# "update" lets Hibernate add missing columns/tables without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── SQL Initialisation ──────────────────────────────────────────────────────
# Run schema.sql on every startup to ensure all 16 tables exist (IF NOT EXISTS guards)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Hibernate must run AFTER the SQL init script so entities see all tables
spring.jpa.defer-datasource-initialization=true

# ─── JWT Configuration ───────────────────────────────────────────────────────
jwt.secret=MyVerySecretKeyForEcoTrackJWTAuthentication2026MyVerySecretKey
jwt.expiration=86400000

# ─── Open-in-view (disable to avoid lazy-load issues in REST APIs) ────────────
spring.jpa.open-in-view=false
